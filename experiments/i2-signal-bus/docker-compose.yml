services:
  redis:
    image: redis:7-alpine
    container_name: i2-signal-bus-paper-redis
    ports:
      - "127.0.0.1:6479:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - i2-signal-bus-paper-redis-data:/data

volumes:
  i2-signal-bus-paper-redis-data:
    name: i2-signal-bus-paper-redis-data
